title = "n8n deploy"

[extend]
useDefault = true

[allowlist]
description = "Local, untracked files"
paths = [
  '''(^|/)\.env$''',
  '''(^|/)\.venv/''',
  '''(^|/)__pycache__/''',
  '''(^|/)\.git/''',
]

[[rules]]
id = "tailscale-authkey"
description = "Tailscale auth, API, client or SCIM key"
regex = '''tskey-(auth|api|client|scim)-[A-Za-z0-9-]{10,}'''
keywords = ["tskey-"]

[[rules]]
id = "tailnet-hostname"
description = "Real tailnet host name (use <tailnet>.ts.net or example.ts.net)"
regex = '''\b[a-z0-9][a-z0-9-]*\.ts\.net\b'''
keywords = [".ts.net"]
[[rules.allowlists]]
regexes = ['''\bexample\.ts\.net\b''']
regexTarget = "match"

[[rules]]
id = "tailscale-cgnat-ip"
description = "Tailscale IPv4 (100.64.0.0/10)"
regex = '''\b100\.(6[4-9]|[7-9][0-9]|1[01][0-9]|12[0-7])\.[0-9]{1,3}\.[0-9]{1,3}\b'''
keywords = ["100."]
[[rules.allowlists]]
description = "Tailscale MagicDNS resolver, the same for everyone"
regexes = ['''\b100\.100\.100\.100\b''']
regexTarget = "match"

[[rules]]
id = "tailscale-ula-ip"
description = "Tailscale IPv6 prefix"
regex = '''fd7a:115c:a1e0:'''
keywords = ["fd7a:"]

[[rules]]
id = "n8n-encryption-key-literal"
description = "Literal n8n encryption key (32+ chars). ${N8N_ENCRYPTION_KEY} is allowed."
regex = '''(?i)N8N_ENCRYPTION_KEY["']?\s*[=:]\s*["']?[A-Za-z0-9+/=_-]{32,}'''
keywords = ["n8n_encryption_key"]

[[rules]]
id = "postgres-password-literal"
description = "Literal Postgres password (16+ chars). ${POSTGRES_PASSWORD} is allowed."
regex = '''(?i)(POSTGRES_PASSWORD|DB_POSTGRESDB_PASSWORD)["']?\s*[=:]\s*["']?[A-Za-z0-9+/=_-]{16,}'''
keywords = ["postgres_password", "postgresdb_password"]

[[rules]]
id = "n8n-api-key-or-mcp-token-literal"
description = "Literal n8n API key or MCP token (20+ chars)"
regex = '''(?i)(N8N_API_KEY|N8N_MCP_TOKEN)["']?\s*[=:]\s*["']?[A-Za-z0-9+/=_.-]{20,}'''
keywords = ["n8n_api_key", "n8n_mcp_token"]

[[rules]]
id = "jwt-shaped-token"
description = "JWT-shaped token (n8n API keys and MCP tokens are JWTs)"
regex = '''eyJ[A-Za-z0-9_-]{10,}\.eyJ[A-Za-z0-9_-]{10,}\.[A-Za-z0-9_-]{10,}'''
keywords = ["eyj"]