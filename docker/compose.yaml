name: n8n

# n8n + Postgres reachable only over Tailscale. ts-n8n and n8n sit on one named bridge network.
# Tailscale Serve proxies https://<node>.<tailnet>.ts.net to http://n8n:5678, so restarting either container does
# not strand the other. No ports are published on the host, and there is no public edge (no Caddy, no 80/443).
# n8n image 2.48.7 = stable on 2026-11-20, digest sha256:fabce3e9...d63861 (first 8 and last 6 chars, checked on Docker Hub).
# Deploy: python scripts/deploy.py stage|sidecar|up  (two steps: the n8n URLs need the sidecar's DNS name)
# SSH recovery: cd /opt/n8n/docker && docker compose -p n8n --env-file /opt/n8n/.env up -d --force-recreate

services:
  ts-n8n:
    image: tailscale/tailscale:v1.104.7
    container_name: ts-n8n
    # No hostname key here: it would make the name 'n8n' resolve to this container itself (via /etc/hosts), not to n8n.
    restart: unless-stopped
    networks:
      - n8n-net
    environment:
      TS_HOSTNAME: ${TS_HOSTNAME:-n8n}
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SERVE_CONFIG: /config/ts-serve.json
      TS_USERSPACE: "false"
      # false: with true, tailscale rewrites resolv.conf to 100.100.100.100 and Serve cannot resolve the Docker name "n8n".
      TS_ACCEPT_DNS: "false"
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - /opt/n8n/ts-state:/var/lib/tailscale
      - ./ts-config:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
    mem_limit: 256m
    memswap_limit: 256m
    labels:
      com.getarcaneapp.arcane.updater: "false"
      com.getarcaneapp.arcane.update-check: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9002/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  postgres:
    image: postgres:16.16-alpine
    container_name: n8n-postgres
    restart: unless-stopped
    networks:
      - n8n-net
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?missing}
    volumes:
      - /opt/n8n/postgres:/var/lib/postgresql/data
    mem_limit: 512m
    memswap_limit: 512m
    labels:
      com.getarcaneapp.arcane.updater: "false"
      com.getarcaneapp.arcane.update-check: "false"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "n8n", "-d", "n8n"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.48.7
    container_name: n8n
    restart: unless-stopped
    networks:
      - n8n-net
    depends_on:
      ts-n8n:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?missing}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?missing}
      N8N_HOST: ${N8N_HOST:-}
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL:-}
      N8N_PROXY_HOPS: "1"
      GENERIC_TIMEZONE: Asia/Ho_Chi_Minh
      TZ: Asia/Ho_Chi_Minh
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "168"
      NODE_OPTIONS: --max-old-space-size=1100
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - /opt/n8n/data:/home/node/.n8n
    mem_limit: 1536m
    memswap_limit: 1536m
    labels:
      com.getarcaneapp.arcane.updater: "false"
      com.getarcaneapp.arcane.update-check: "false"
    healthcheck:
      # node is guaranteed in the image; wget presence was not assumed. 127.0.0.1 avoids an IPv6-first lookup.
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5678/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

networks:
  n8n-net:
    name: n8n_net
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/24
